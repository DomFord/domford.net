name: Build and deploy to GitHub Pages
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Latest Zola release. Check https://github.com/getzola/zola/releases
      # before changing this, and update ZOLA_SHA256 to match.
      ZOLA_VERSION: "0.23.6"
      ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ARCH="x86_64-unknown-linux-gnu"
          URL="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${ARCH}.tar.gz"
          curl -sSL --fail "$URL" -o zola.tar.gz
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola

      - name: Verify Zola version
        run: |
          installed="$(zola --version | awk '{print $2}')"
          echo "Installed Zola: ${installed} (expected ${ZOLA_VERSION})"
          if [ "$installed" != "$ZOLA_VERSION" ]; then
            echo "::error::Zola version mismatch: expected ${ZOLA_VERSION}, got ${installed}"
            exit 1
          fi

      - name: Build site
        run: zola build

      - name: Check build output
        run: |
          ls -la public
          test -d public && test "$(ls -A public)" || (echo "public missing or empty" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    # Deliberately a separate job. deploy-pages looks the artifact up through the
    # Actions artifact service, which can return nothing for an artifact that was
    # finalised a fraction of a second earlier (actions/deploy-pages#451). A new
    # job adds a few seconds and, unlike a re-run of a combined job, does not
    # upload a second github-pages artifact.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # The lookup failure happens before any deployment is created, so a retry
      # is safe and usually succeeds once the artifact has propagated.
      - name: Wait for the artifact to propagate
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
